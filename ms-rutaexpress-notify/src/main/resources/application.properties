spring.application.name=ms-rutaexpress-notify
server.port=8084


#  CONEXION A RABBITMQ (clúster de 2 nodos)


spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASS}


#  NOMBRES DE LA INFRAESTRUCTURA (centralizados)
#  Todo nombre de exchange, cola, DLQ y routing key vive SOLO aquí.



# Exchanges
app.rabbitmq.exchanges.events=rutaexpress.events.topic
app.rabbitmq.exchanges.commands=rutaexpress.cmd.direct
app.rabbitmq.exchanges.dlx=rutaexpress.dlx

# Colas de trabajo
app.rabbitmq.queues.email=q.cmd.email
app.rabbitmq.queues.warehouse=q.cmd.warehouse
app.rabbitmq.queues.label=q.cmd.label

# Colas de mensajes no entregados (DLQ)
app.rabbitmq.dlqs.email=q.cmd.email.dlq
app.rabbitmq.dlqs.warehouse=q.cmd.warehouse.dlq
app.rabbitmq.dlqs.label=q.cmd.label.dlq

#patrones
#email-> topic:  cualquier cambio de estado de un envio
#warehouse-> topic:  solo cuando un envio es aceptado
#label-> direct: comando para generar la etiqueta
app.rabbitmq.routing.email=shipment.*
app.rabbitmq.routing.warehouse=shipment.aceptado
app.rabbitmq.routing.label=label.generate
app.rabbitmq.routing.dlq-email=dlq.email
app.rabbitmq.routing.dlq-warehouse=dlq.warehouse
app.rabbitmq.routing.dlq-label=dlq.label


#  CONSUMIDORES: confirmacion (ACK) y manejo de errores

# manual: el codigo decide cuando confirmar (ACK) o rechazar (NACK)
spring.rabbitmq.listener.simple.acknowledge-mode=manual
# 1 mensaje a la vez por consumidor
spring.rabbitmq.listener.simple.prefetch=1
# un mensaje rechazado NO vuelve a la cola: el broker lo manda al DLX -> DLQ
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Reintentos ante fallas temporales (los aplica AckHandler antes de mandar a la DLQ)
app.rabbitmq.retry.max-attempts=3
app.rabbitmq.retry.backoff-ms=2000


# simula una falla temporal
app.rabbitmq.simulate-failure-prefix=FAIL

# Carpeta donde se guardan los PDF generados (en K8s se define DOCUMENTS_DIR)
app.documents.output-dir=${DOCUMENTS_DIR:./documents}
# URL base que codifica el QR de la etiqueta (se le agrega el id del envio)
app.documents.tracking-base-url=${TRACKING_BASE_URL:http://localhost:5173/shipments/}